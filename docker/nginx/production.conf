upstream portal_upstream   { server portal:3000; }
upstream jobcards_upstream { server jobcards:3001; }
upstream docs_upstream     { server documents:3002; }
upstream ts_upstream       { server timesheets:3003; }
upstream ops_upstream     { server operations:3004; }
server {
  listen 80;

  resolver 127.0.0.11 valid=10s;

  client_max_body_size 50m;

  proxy_connect_timeout 10s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;

  # Normalize no-trailing-slash to trailing-slash (preserve host:port)
  location = /jobcards   { return 301 $scheme://$http_host/jobcards/; }
  location = /documents  { return 301 $scheme://$http_host/documents/; }
  location = /timesheets { return 301 $scheme://$http_host/timesheets/; }
  location = /operations { return 301 $scheme://$http_host/operations/; }
  location = /scanner    { return 301 $scheme://$http_host/scanner/; }
  location = /laserquote { return 301 $scheme://$http_host/laserquote/; }
  location = /assembly   { return 301 $scheme://$http_host/assembly/; }
  location = /nesting    { return 301 $scheme://$http_host/nesting/; }
  location = /matl-cert         { return 301 $scheme://$http_host/matl-cert/; }
  location = /employee-presence { return 301 $scheme://$http_host/employee-presence/; }
  location = /orderbook         { return 301 $scheme://$http_host/orderbook/; }
  location = /po-analysis       { return 301 $scheme://$http_host/po-analysis/; }
  location = /production-card   { return 301 $scheme://$http_host/production-card/; }
  location = /nc1cad            { return 301 $scheme://$http_host/nc1cad/; }
  location = /purchase-order    { return 301 $scheme://$http_host/purchase-order/; }
  location = /admin             { return 301 $scheme://$http_host/admin/; }
  location = /wiki              { return 301 $scheme://$http_host/wiki/; }


  location / {
    proxy_pass http://portal_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /jobcards/ {
    proxy_pass http://jobcards_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /documents/ {
    proxy_pass http://docs_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /timesheets/ {
    proxy_pass http://ts_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /operations/ {
    proxy_pass http://ops_upstream;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /scanner/ {
    set $scanner_backend http://scanner:3005;
    proxy_pass $scanner_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /laserquote/ {
    set $laserquote_backend http://laserquote:3006;
    proxy_pass $laserquote_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /assembly/ {
    set $assembly_backend http://assembly-viewer:3007;
    proxy_pass $assembly_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /nesting/ {
    set $nesting_backend http://nesting:3008;
    proxy_pass $nesting_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 180s;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /matl-cert/ {
    set $matl_cert_backend http://10.0.0.75:3010;
    proxy_pass $matl_cert_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /employee-presence/ {
    set $employee_presence_backend http://10.0.0.75:3011;
    proxy_pass $employee_presence_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /orderbook/ {
    set $orderbook_backend http://10.0.0.75:3012;
    proxy_pass $orderbook_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /po-analysis/ {
    set $po_analysis_backend http://10.0.0.75:3013;
    proxy_pass $po_analysis_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /production-card/ {
    set $production_card_backend http://10.0.0.75:3014;
    proxy_pass $production_card_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /nc1cad/ {
    set $nc1cad_app_backend http://10.0.0.75:3016;
    proxy_pass $nc1cad_app_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  location /purchase-order/ {
    set $purchase_order_backend http://10.0.0.75:3017;
    proxy_pass $purchase_order_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # Estate health dashboard (pss-admin-ui). Polls every other service on this
  # list, so keep it OUT of any maintenance mode that returns a static page for
  # `/` — the one moment it is worth reaching is when something else is broken.
  location /admin/ {
    set $admin_ui_backend http://10.0.0.75:3019;
    proxy_pass $admin_ui_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }

  # PSS Wiki (BookStack), standalone stack on :3018, served as a subpath.
  # Requires BookStack APP_URL to end in /wiki so it builds its own links under
  # this prefix; the variable proxy_pass passes the /wiki/ prefix through intact.
  # Body limit lifted above the global 50m for image/video uploads — raise
  # BookStack's own FILE_UPLOAD_SIZE_LIMIT to match if large media is expected.
  location /wiki/ {
    set $wiki_backend http://10.0.0.75:3018;
    proxy_pass $wiki_backend;
    proxy_http_version 1.1;
    proxy_redirect off;
    client_max_body_size 512m;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  }
}
